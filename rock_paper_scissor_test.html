			Rock Paper Scissor

		<button onclick="
      const randomNumber = Math.random();

      let computerMove = '';
      if(randomNumber < 1/3)
      {
        computerMove = 'Rock';
      }
      else if(randomNumber < 2/3){
        computerMove = 'Paper';
      }
      else{
        computerMove = 'Scissor';
      }

      let result = '';

      if(computerMove === 'Rock')
      {
        result = 'Tie.';
      }
      else if(computerMove === 'Paper')
      {
        result = 'OOPs! You Lose';
      }
      else
      {
        result = 'Hurrah! You Won';
      }
      console.log(result);
      alert(`You pick Rock . Computer pick ${computerMove} . ${result}`);
      "
		  >Rock
		</button>
