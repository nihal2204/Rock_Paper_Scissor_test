<!DOCTYPE html>
<html>
  <head>
    <title>Rock ,Paper And Scissor</title>
		<style>
			p{
				font-size: 24px;
			}
			button{
				font-family: Arial, Helvetica, sans-serif;
				font-weight: 600;
				font-size: 16px;
			}
		</style>
  </head>
  <body> 
		<p>
			Rock Paper Scissor
		</p>

		<button onclick="  
      playGame('Rock');
		  ">Rock
		</button>

		<button onclick="
      playGame('Paper');
      "
      >Paper
		</button>

		<button onclick="
      playGame('Scissor');
      "
      >Scissor
		</button>
		
		<p>
      Click here to see the final version of the project
    </p>
		
		<script>
      function playGame(playerMove){
        const computerMove = pickcomputermove();
        let result = '';
        if(playerMove === 'Scissor')
        {
          if(computerMove === 'Rock')
          {
            result = 'OOPs! You Lose';
          }
          else if(computerMove === 'Paper')
          {
            result = 'Hurrah! You Won';
          }
          else
          {
            result = 'Tie';
          } 
        }
        else if(playerMove === 'Rock')
        {
          if(computerMove === 'Rock')
          {
            result = 'Tie.';
          }
          else if(computerMove === 'Paper')
          {
            result = 'OOPs! You Lose';
          }
          else
          {
            result = 'Hurrah! You Won';
          }
        }
        else if(playerMove === 'Paper'){
          if(computerMove === 'Rock')
          {
            result = 'Hurrah! You Won';
          }
          else if(computerMove === 'Paper')
          {
            result = 'Tie';
          }
          else
          {
            result = 'OOPs! You Lose';
          }       
        }
        console.log(result);
        alert(`You pick ${playerMove} . Computer pick ${computerMove} . ${result}`);
      }
      
      function pickcomputermove(){
        const randomNumber = Math.random();
        let computerMove = '';
        if(randomNumber < 1/3)
        {
          computerMove = 'Rock';
        }
        else if(randomNumber < 2/3){
          computerMove = 'Paper';
        }
        else{
          computerMove = 'Scissor';
        }
        return computerMove;
      }
    </script>

  </body>
</html>
